# The website is the one front door for all 3 services (one URL, no CORS).
# This is a template: when the container starts, nginx fills in ${AGENT_URL} and ${IMAGES_URL}
# from Cloud Run env vars (set in cloudbuild.yaml). Laptops use the same paths via ui/vite.config.ts.
server {
  # Cloud Run sends traffic to port 8080 by default.
  listen 8080;
  root /usr/share/nginx/html;

  # Cloud Run picks the service by its hostname, so send the right name (SNI) over HTTPS.
  proxy_ssl_server_name on;

  # Agent (server/)
  location = /api/chat { proxy_pass ${AGENT_URL}; }

  # Photo reader (image-recognition/). Uploads can be up to 15 MB, and reading a photo takes a while.
  location /api/items {
    proxy_pass ${IMAGES_URL};
    client_max_body_size 16m;
    proxy_read_timeout 120s;
  }
  location /images/ { proxy_pass ${IMAGES_URL}; }

  # Both services have /api/health, so each gets its own path here.
  location = /api/agent/health { proxy_pass ${AGENT_URL}/api/health; }
  location = /api/images/health { proxy_pass ${IMAGES_URL}/api/health; }

  # Unknown API paths: a real 404, not the website's index.html.
  location /api/ { return 404; }

  # Page routes like /lost/category have no file of their own: send index.html
  # and let React pick the page (see ui/README.md).
  location / {
    try_files $uri /index.html;
  }
}
